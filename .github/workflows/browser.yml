name: Browser acceptance

on:
  push:
    branches: [main]
  # Exercise app and harness changes before they land on main.
  pull_request:
    paths:
      - 'src/**'
      - '.github/workflows/browser.yml'
      - 'playwright.config.mjs'
      - 'tests/browser/**'
      - 'scripts/*.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
  workflow_dispatch:

permissions:
  contents: read

# No concurrency group: a later merge must not replace a pending main run.
jobs:
  browser:
    name: Full browser suites
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check:runtime
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Retain browser reports and partial failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
