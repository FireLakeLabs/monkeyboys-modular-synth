name: Wild reader coverage (report only)

on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read

jobs:
  report:
    name: Pinned public corpus report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run coverage:reader:wild
      - name: Retain metrics only (no downloaded source)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wild-reader-coverage-${{ github.run_id }}
          path: reports/reader/*.json
          if-no-files-found: warn
          retention-days: 30
